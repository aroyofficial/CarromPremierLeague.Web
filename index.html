<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>CPL - Carrom Premier League</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f8fc" />
		<link rel="manifest" href="manifest.webmanifest" />
		<script>
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem("cpl_theme");
				} catch (e) {}
				var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
				var root = document.documentElement;
				var value = dark ? "dark" : "light";
				if (dark) root.classList.add("dark");
				root.setAttribute("data-bs-theme", value);
				root.style.colorScheme = value;
				root.style.backgroundColor = dark ? "#0b1220" : "#f6f8fc";
				document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b1220" : "#f6f8fc");
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/src/assets/styles/global.css" />
	</head>
	<body>
		<div id="app"></div>
		<script src="/runtime-config.js"></script>
		<script type="module" src="/src/main.js"></script>
		<script type="module" src="/src/utils/common.js"></script>
	</body>
</html>
