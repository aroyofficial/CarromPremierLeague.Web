<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>CPL - League Table</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<link href="../assets/css/style.css" rel="stylesheet" />
	</head>
	<body>
		<div class="container py-5">
			<!-- Page Title -->
			<div class="text-center mb-4">
				<h1 class="fw-bold">🏆 CPL League Table</h1>
				<p class="text-muted">Carrom Premier League Standings</p>
			</div>

			<!-- Season Dropdown -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-4">
					<select id="seasonSelect" class="form-select">
						<option value="1">Season 1</option>
						<option value="2">Season 2</option>
					</select>
				</div>
			</div>

			<!-- Loading -->
			<div id="loading" class="text-center my-4 d-none">
				<div class="spinner-border text-primary"></div>
				<p class="mt-2">Loading league table...</p>
			</div>

			<!-- League Table -->
			<div class="table-responsive shadow rounded">
				<table class="table table-striped table-hover align-middle text-center">
					<thead class="table-dark">
						<tr>
							<th>#</th>
							<th>Team</th>
							<th>MP</th>
							<th>W</th>
							<th>Pts</th>
							<th>Net Pts</th>
						</tr>
					</thead>
					<tbody id="leagueTableBody">
						<!-- Data will be injected here -->
					</tbody>
				</table>
			</div>
		</div>

		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

		<!-- JS Files -->
		<script src="../assets/js/config.js"></script>
		<script src="../assets/js/api.js"></script>
		<script src="../assets/js/league.js"></script>
	</body>
</html>
